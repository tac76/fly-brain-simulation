[project]
name = "fly-brain-simulation"
version = "0.1.0"
description = "A model of the real fruit fly brain decides how a simulated fly escapes a looming threat."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "torch",
    "flygym[examples]==1.2.1",
    "networkx",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "fastapi>=0.143.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
flybrain = "flybrain.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flybrain", "server"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest",
    "ruff",
]
assets = ["trimesh", "fast-simplification"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs downloaded FlyWire data or long runtime"]
filterwarnings = ["ignore::UserWarning:glfw"]  # headless: no X11 display, rendering unused

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
default-groups = ["dev", "assets"]
